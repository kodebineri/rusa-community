name: mongodb_compass_flutter
description: "A professional MongoDB Compass web and desktop client built with Flutter, migrating React TSX components to high-fidelity Flutter widgets."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  file_selector: ^1.1.0
  mongo_dart: ^0.10.10
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  assets:
    # License text rendered by EulaModal (lib/widgets/modals/eula_modal.dart).
    - EULA.md
