name: rusa
description: "Rusa — an independent MongoDB database client built with Flutter. Not affiliated with MongoDB, Inc."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  file_selector: ^1.1.0
  mongo_dart: ^0.10.10
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  assets:
    # License text rendered by EulaModal (lib/widgets/modals/eula_modal.dart).
    - EULA.md
    # Privacy text rendered by PrivacyPolicyModal
    # (lib/widgets/modals/privacy_policy_modal.dart).
    - PRIVACY.md

  # Bundled so the UI renders with the same faces on Windows, Android and iOS
  # instead of falling back to each platform's system font. The families match
  # `CompassTypography.fontSans` / `fontMono` / `fontTitle`
  # (lib/theme/compass_typography.dart).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/Outfit-Bold.ttf
          weight: 700
