name: Build, Publish Multi-Arch DNF Repo and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Linux Binaries & Package .rpm (x86_64 + aarch64)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & RPM Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev git curl unzip rpm

      # --- Setup Flutter for amd64 ---
      - name: Setup Flutter Engine (amd64)
        if: matrix.target_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- Setup Flutter for arm64 (Git Clone Fallback) ---
      - name: Setup Flutter Engine (arm64 Git Fallback)
        if: matrix.target_arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Enable Linux Desktop Build & Setup Platform
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Create .rpm Package
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$RAW_TAG" = "main" ]; then
            VERSION="0.0.0"
          fi

          RPM_ARCH="${{ matrix.rpm_arch }}"
          BUILD_ROOT="$(pwd)/build/rpm/BUILDROOT/rusa-community-${VERSION}-1.${RPM_ARCH}"

          mkdir -p "${BUILD_ROOT}/usr/lib/rusa-community"
          mkdir -p "${BUILD_ROOT}/usr/bin"
          mkdir -p "${BUILD_ROOT}/usr/share/applications"
          mkdir -p "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps"

          # Copy Flutter Linux bundle outputs dynamically
          BUILD_BUNDLE=$(find build/linux -type d -name "bundle" | head -n 1)
          cp -r ${BUILD_BUNDLE}/* "${BUILD_ROOT}/usr/lib/rusa-community/"

          # Symlink binary to /usr/bin
          ln -s /usr/lib/rusa-community/rusa-community "${BUILD_ROOT}/usr/bin/rusa-community"

          # Copy icon if available
          if [ -f "assets/icon/icon.png" ]; then
            cp assets/icon/icon.png "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/rusa-community.png"
          fi

          # Desktop entry metadata
          cat <<EOF > "${BUILD_ROOT}/usr/share/applications/rusa-community.desktop"
          [Desktop Entry]
          Name=Rusa Community
          Comment=MongoDB GUI Client Community Edition
          Exec=/usr/bin/rusa-community %U
          Icon=rusa-community
          Terminal=false
          Type=Application
          Categories=Development;Database;
          EOF

          # Generate RPM Spec File dynamically
          mkdir -p build/rpm/SPECS
          cat <<EOF > build/rpm/SPECS/rusa-community.spec
          Name:           rusa-community
          Version:        ${VERSION}
          Release:        1
          Summary:        Rusa Community MongoDB GUI Client (${RPM_ARCH})
          License:        GPL-3.0
          URL:            https://github.com/${{ github.repository }}
          AutoReqProv:    no

          %description
          Rusa Community Edition GUI client built for Linux (${RPM_ARCH}).

          %files
          /usr/lib/rusa-community
          /usr/bin/rusa-community
          /usr/share/applications/rusa-community.desktop
          /usr/share/icons/hicolor/256x256/apps/rusa-community.png
          EOF

          # Build RPM binary package
          rpmbuild --define "_topdir $(pwd)/build/rpm" --target ${RPM_ARCH} -bb build/rpm/SPECS/rusa-community.spec

          mkdir -p dist
          mv build/rpm/RPMS/${RPM_ARCH}/*.rpm dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-${{ matrix.target_arch }}
          path: dist/*.rpm

  # ---------------------------------------------------------------------------
  # 2. Collect Artifacts, Publish DNF Repo & GitHub Releases
  # ---------------------------------------------------------------------------
  publish-repo:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Createrepo & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c gpg

      - name: Import GPG Private Key
        run: |
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            # Export public key for users to import via dnf
            gpg --armor --export > public.key
          fi

      - name: Download Built .rpm Artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpm-artifacts
          pattern: rpm-package-*
          merge-multiple: true

      - name: Generate Multi-Arch DNF Repository
        run: |
          mkdir -p public/Packages

          RPM_COUNT=$(find rpm-artifacts -name "*.rpm" | wc -l)
          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "Error: No .rpm packages found in rpm-artifacts directory!"
            exit 1
          fi

          # Move packages into repository structure
          cp rpm-artifacts/*.rpm public/Packages/

          # Generate DNF/YUM repodata metadata
          createrepo_c public/

          # Sign repomd.xml if GPG key is present
          if [ -f "public.key" ]; then
            cp public.key public/RPM-GPG-KEY-rusa-community
            gpg --detach-sign --armor --yes public/repodata/repomd.xml
          fi

          # Create a helper .repo file for end-users
          PAGE_URL="${{ steps.pages.outputs.page_url }}"
          cat <<EOF > public/rusa-community.repo
          [rusa-community]
          name=Rusa Community Official Repository
          baseurl=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          enabled=1
          gpgcheck=1
          gpgkey=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/RPM-GPG-KEY-rusa-community
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build (v0.0.0-dev)' }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: rpm-artifacts/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Deploy DNF Repository to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-pages:
    needs: publish-repo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
