name: Build, Publish Multi-Arch DNF Repo and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Linux Binaries & Package/Sign .rpm via Fedora Container
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev git curl unzip

      # --- Setup Flutter for amd64 ---
      - name: Setup Flutter Engine (amd64)
        if: matrix.target_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- Setup Flutter for arm64 (Git Clone Fallback) ---
      - name: Setup Flutter Engine (arm64 Git Fallback)
        if: matrix.target_arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Enable Linux Desktop Build & Setup Platform
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      # --- Package, Sign & Verify RPM inside Native Fedora Container ---
      # --- Package, Sign & Verify RPM inside Native Fedora Container ---
      - name: Package and Sign RPM inside Fedora Container
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:latest
          options: -v ${{ github.workspace }}:/workspace
          run: |
            dnf install -y rpm-build rpm-sign gpg

            cd /workspace

            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
            if [ -z "$VERSION" ] || [ "$RAW_TAG" = "main" ]; then
              VERSION="0.0.0"
            fi

            RPM_ARCH="${{ matrix.rpm_arch }}"
            RPM_TOPDIR="/workspace/build/rpm"
            BUILD_ROOT="${RPM_TOPDIR}/BUILDROOT/rusa-community-${VERSION}-1.${RPM_ARCH}"

            # 1. Setup explicit RPM build tree structure
            mkdir -p "${RPM_TOPDIR}/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

            mkdir -p "${BUILD_ROOT}/usr/lib/rusa-community"
            mkdir -p "${BUILD_ROOT}/usr/bin"
            mkdir -p "${BUILD_ROOT}/usr/share/applications"
            mkdir -p "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps"

            # Copy Flutter bundle output
            BUILD_BUNDLE=$(find build/linux -type d -name "bundle" | head -n 1)
            cp -r ${BUILD_BUNDLE}/* "${BUILD_ROOT}/usr/lib/rusa-community/"

            # Symlink binary to /usr/bin
            ln -s /usr/lib/rusa-community/rusa-community "${BUILD_ROOT}/usr/bin/rusa-community"

            # Copy icon if present
            if [ -f "assets/icon/icon.png" ]; then
              cp assets/icon/icon.png "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/rusa-community.png"
            fi

            # Desktop entry metadata
            cat <<EOF > "${BUILD_ROOT}/usr/share/applications/rusa-community.desktop"
            [Desktop Entry]
            Name=Rusa Community
            Comment=MongoDB GUI Client Community Edition
            Exec=/usr/bin/rusa-community %U
            Icon=rusa-community
            Terminal=false
            Type=Application
            Categories=Development;Database;
            EOF

            # Spec file creation
            cat <<EOF > ${RPM_TOPDIR}/SPECS/rusa-community.spec
            Name:           rusa-community
            Version:        ${VERSION}
            Release:        1
            Summary:        Rusa Community MongoDB GUI Client (${RPM_ARCH})
            License:        GPL-3.0
            URL:            https://github.com/${{ github.repository }}
            AutoReqProv:    no

            %description
            Rusa Community Edition GUI client built for Linux (${RPM_ARCH}).

            %files
            /usr/lib/rusa-community
            /usr/bin/rusa-community
            /usr/share/applications/rusa-community.desktop
            /usr/share/icons/hicolor/256x256/apps/rusa-community.png
            EOF

            # 2. Build RPM package using explicit topdir
            rpmbuild --define "_topdir ${RPM_TOPDIR}" --target ${RPM_ARCH} -bb ${RPM_TOPDIR}/SPECS/rusa-community.spec

            # 3. Robust package collection into dist/
            mkdir -p dist
            BUILT_RPM=$(find ${RPM_TOPDIR}/RPMS -type f -name "*.rpm" | head -n 1)
            if [ -z "$BUILT_RPM" ]; then
              echo "Error: rpmbuild failed to produce an RPM package in ${RPM_TOPDIR}/RPMS!"
              exit 1
            fi
            mv "$BUILT_RPM" dist/

            # --- GPG RPM Signing ---
            GPG_KEY="${{ secrets.GPG_PRIVATE_KEY }}"
            GPG_PASS="${{ secrets.GPG_PASSPHRASE }}"

            if [ -z "$GPG_KEY" ]; then
              echo "Error: GPG_PRIVATE_KEY secret is not defined."
              exit 1
            fi

            echo "$GPG_KEY" | gpg --batch --import
            GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -E '^sec' | awk '{print $2}' | cut -d'/' -f2 | head -n 1)

            # Export public key & import into native RPM keyring
            gpg --armor --export "$GPG_KEY_ID" > /tmp/public.key
            rpm --import /tmp/public.key

            # Native Fedora rpmmacros
            cat <<EOF > ~/.rpmmacros
            %_signature gpg
            %_gpg_path ~/.gnupg
            %_gpg_name $GPG_KEY_ID
            %_gpgbin /usr/bin/gpg
            EOF

            # 4. Sign RPM packages & verify natively
            for rpm_file in dist/*.rpm; do
              echo "Signing $rpm_file..."
              if [ -n "$GPG_PASS" ]; then
                echo "$GPG_PASS" | rpmsign --addsign --pinentry-mode loopback --passphrase-fd 0 "$rpm_file"
              else
                rpmsign --addsign "$rpm_file"
              fi

              echo "Verifying $rpm_file..."
              rpm -v -K "$rpm_file"
            done

      - name: Upload Signed RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-${{ matrix.target_arch }}
          path: dist/*.rpm

  # ---------------------------------------------------------------------------
  # 2. Collect Artifacts, Generate DNF Repo & Publish Release
  # ---------------------------------------------------------------------------
  publish-repo:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Repository with Fedora Container
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:latest
          options: -v ${{ github.workspace }}:/workspace
          run: |
            dnf install -y createrepo_c gpg

            cd /workspace
            mkdir -p public/Packages

            # Downloaded artifacts path
            cp rpm-artifacts/*.rpm public/Packages/ 2>/dev/null || true

      - name: Download Built & Signed .rpm Artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpm-artifacts
          pattern: rpm-package-*
          merge-multiple: true

      - name: Generate DNF Repo Metadata & Sign repomd.xml
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:latest
          options: -v ${{ github.workspace }}:/workspace
          run: |
            dnf install -y createrepo_c gpg

            cd /workspace
            mkdir -p public/Packages
            cp rpm-artifacts/*.rpm public/Packages/

            # Generate DNF metadata
            createrepo_c public/

            # Import GPG key & export public key
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --armor --export > public/RPM-GPG-KEY-rusa-community

            # Sign repomd.xml
            GPG_PASS="${{ secrets.GPG_PASSPHRASE }}"
            if [ -n "$GPG_PASS" ]; then
              echo "$GPG_PASS" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor --yes public/repodata/repomd.xml
            else
              gpg --batch --detach-sign --armor --yes public/repodata/repomd.xml
            fi

            # Generate end-user .repo file
            cat <<EOF > public/rusa-community.repo
            [rusa-community]
            name=Rusa Community Official Repository
            baseurl=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            enabled=1
            gpgcheck=1
            repo_gpgcheck=1
            gpgkey=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/RPM-GPG-KEY-rusa-community
            EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build (v0.0.0-dev)' }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: rpm-artifacts/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Deploy DNF Repository to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-pages:
    needs: publish-repo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
