name: Build, Publish Multi-Arch DNF Repo and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Linux Binaries, Package & Auto-Sign .rpm (x86_64 + aarch64)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies, RPM Tools & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev git curl unzip rpm pinentry-tty gpg

      # --- Setup Flutter for amd64 ---
      - name: Setup Flutter Engine (amd64)
        if: matrix.target_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- Setup Flutter for arm64 (Git Clone Fallback) ---
      - name: Setup Flutter Engine (arm64 Git Fallback)
        if: matrix.target_arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Enable Linux Desktop Build & Setup Platform
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Create .rpm Package
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] \vert{}\vert{} [ "$RAW_TAG" = "main" ]; then
            VERSION="0.0.0"
          fi

          RPM_ARCH="${{ matrix.rpm_arch }}"
          BUILD_ROOT="$(pwd)/build/rpm/BUILDROOT/rusa-community-${VERSION}-1.${RPM_ARCH}"

          mkdir -p "${BUILD_ROOT}/usr/lib/rusa-community"
          mkdir -p "${BUILD_ROOT}/usr/bin"
          mkdir -p "${BUILD_ROOT}/usr/share/applications"
          mkdir -p "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps"

          # Copy Flutter Linux bundle outputs dynamically
          BUILD_BUNDLE=$(find build/linux -type d -name "bundle" | head -n 1)
          cp -r ${BUILD_BUNDLE}/* "${BUILD_ROOT}/usr/lib/rusa-community/"

          # Symlink binary to /usr/bin
          ln -s /usr/lib/rusa-community/rusa-community "${BUILD_ROOT}/usr/bin/rusa-community"

          # Copy icon if available
          if [ -f "assets/icon/icon.png" ]; then
            cp assets/icon/icon.png "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/rusa-community.png"
          fi

          # Desktop entry metadata
          cat <<EOF > "${BUILD_ROOT}/usr/share/applications/rusa-community.desktop"
          [Desktop Entry]
          Name=Rusa Community
          Comment=MongoDB GUI Client Community Edition
          Exec=/usr/bin/rusa-community %U
          Icon=rusa-community
          Terminal=false
          Type=Application
          Categories=Development;Database;
          EOF

          # Generate RPM Spec File dynamically
          mkdir -p build/rpm/SPECS
          cat <<EOF > build/rpm/SPECS/rusa-community.spec
          Name:           rusa-community
          Version:        ${VERSION}
          Release:        1
          Summary:        Rusa Community MongoDB GUI Client (${RPM_ARCH})
          License:        GPL-3.0
          URL:            https://github.com/${{ github.repository }}
          AutoReqProv:    no

          %description
          Rusa Community Edition GUI client built for Linux (${RPM_ARCH}).

          %files
          /usr/lib/rusa-community
          /usr/bin/rusa-community
          /usr/share/applications/rusa-community.desktop
          /usr/share/icons/hicolor/256x256/apps/rusa-community.png
          EOF

          # Build RPM binary package
          rpmbuild --define "_topdir $(pwd)/build/rpm" --target ${RPM_ARCH} -bb build/rpm/SPECS/rusa-community.spec

          mkdir -p dist
          mv build/rpm/RPMS/${RPM_ARCH}/*.rpm dist/

      - name: Sign RPM Packages with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Error: GPG_PRIVATE_KEY secret is not defined."
            exit 1
          fi

          # Import GPG Private Key & set owner trust
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -E '^sec' | awk '{print $2}' | cut -d'/' -f2 | head -n 1)
          GPG_FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -n 1 | cut -d':' -f10)

          if [ -n "$GPG_FPR" ]; then
            echo "${GPG_FPR}:6:" | gpg --import-ownertrust
          fi

          echo "Signing RPMs with GPG Key ID: $GPG_KEY_ID"

          # Configure ~/.rpmmacros without legacy flags
          cat <<EOF > ~/.rpmmacros
          %_signature gpg
          %_gpg_path ~/.gnupg
          %_gpg_name $GPG_KEY_ID
          %_gpgbin /usr/bin/gpg
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --passphrase-fd 0 --pinentry-mode loopback --detach-sign --sign --detach-sign %{?_gpg_digest_algo:--digest-algo %{_gpg_digest_algo}} -u "%{_gpg_name}" -s -o %{__signature_filename} %{__plaintext_filename}
          EOF

          # Sign all built RPM files
          for rpm_file in dist/*.rpm; do
            echo "Signing $rpm_file..."
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | rpmsign --addsign --pinentry-mode loopback --passphrase-fd 0 "$rpm_file"
            else
              rpmsign --addsign "$rpm_file"
            fi
          done
     - name: Verify Signed RPM Packages
        run: |
          # 1. Export GPG public key to a standard ASCII-armored key file
          gpg --armor --export > /tmp/public.key

          # 2. Build a local temporary RPM keyring DB
          mkdir -p /tmp/rpm-keyring
          rpmdb --initdb --dbpath /tmp/rpm-keyring
          rpm --dbpath /tmp/rpm-keyring --import /tmp/public.key

          # 3. Verify RPM packages against the isolated local RPM keyring
          for rpm_file in dist/*.rpm; do
            echo "Verifying $rpm_file..."
            rpm --dbpath /tmp/rpm-keyring -v -K "$rpm_file"
          done

      - name: Upload Signed RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-${{ matrix.target_arch }}
          path: dist/*.rpm

  # ---------------------------------------------------------------------------
  # 2. Collect Artifacts, Generate DNF Repo & Publish Release
  # ---------------------------------------------------------------------------
  publish-repo:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Createrepo & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c gpg

      - name: Import GPG Private Key & Export Public Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Error: GPG_PRIVATE_KEY secret is not defined."
            exit 1
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --armor --export > public.key

      - name: Download Built & Signed .rpm Artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpm-artifacts
          pattern: rpm-package-*
          merge-multiple: true

      - name: Generate Multi-Arch DNF Repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p public/Packages

          RPM_COUNT=$(find rpm-artifacts -name "*.rpm" | wc -l)
          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "Error: No .rpm packages found in rpm-artifacts directory!"
            exit 1
          fi

          # Copy signed RPM packages into repo structure
          cp rpm-artifacts/*.rpm public/Packages/

          # Generate DNF metadata
          createrepo_c public/

          # Copy GPG Public Key to public directory
          cp public.key public/RPM-GPG-KEY-rusa-community

          # Detach-sign repomd.xml for repository integrity
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor --yes public/repodata/repomd.xml
          else
            gpg --batch --detach-sign --armor --yes public/repodata/repomd.xml
          fi

          # Generate DNF .repo configuration file for end users
          cat <<EOF > public/rusa-community.repo
          [rusa-community]
          name=Rusa Community
