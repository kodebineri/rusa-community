name: Build, Publish Multi-Arch APT Repo and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Linux Binaries & Package .deb (amd64 + arm64)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_arch: amd64
          - os: ubuntu-24.04-arm
            target_arch: arm64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Build & Setup Platform
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Create .deb Package
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$RAW_TAG" = "main" ]; then
            VERSION="0.0.0-dev"
          fi

          ARCH="${{ matrix.target_arch }}"
          PKG_DIR="build/debian/rusa-community_${VERSION}_${ARCH}"

          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/lib/rusa-community"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"

          # Copy Flutter Linux bundle outputs
          BUILD_BUNDLE=$(find build/linux -type d -name "bundle" | head -n 1)
          cp -r ${BUILD_BUNDLE}/* "${PKG_DIR}/usr/lib/rusa-community/"

          # Symlink binary to /usr/bin
          ln -s /usr/lib/rusa-community/rusa-community "${PKG_DIR}/usr/bin/rusa-community"

          # Copy icon if available
          if [ -f "assets/icon/icon.png" ]; then
            cp assets/icon/icon.png "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/rusa-community.png"
          fi

          # Desktop entry metadata
          cat <<EOF > "${PKG_DIR}/usr/share/applications/rusa-community.desktop"
          [Desktop Entry]
          Name=Rusa Community
          Comment=MongoDB GUI Client Community Edition
          Exec=/usr/bin/rusa-community %U
          Icon=rusa-community
          Terminal=false
          Type=Application
          Categories=Development;Database;
          EOF

          # DEBIAN control file
          cat <<EOF > "${PKG_DIR}/DEBIAN/control"
          Package: rusa-community
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: Kodebineri <kodebineri@gmail.com>
          Description: Rusa Community MongoDB GUI Client (${ARCH})
          Section: utils
          Priority: optional
          EOF

          dpkg-deb --build "${PKG_DIR}"
          mkdir -p dist
          mv build/debian/*.deb dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-${{ matrix.target_arch }}
          path: dist/*.deb

  # ---------------------------------------------------------------------------
  # 2. Collect Artifacts, Publish APT Repo & GitHub Releases
  # ---------------------------------------------------------------------------
  publish-repo:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Aptly & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gpg

      - name: Import GPG Private Key
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Error: GPG_PRIVATE_KEY secret is missing or empty."
            exit 1
          fi
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Download Built .deb Artifacts
        uses: actions/download-artifact@v4
        with:
          path: deb-artifacts
          pattern: deb-package-*
          merge-multiple: true

      - name: Generate Multi-Arch APT Repository
        run: |
          mkdir -p deb-artifacts

          DEB_COUNT=$(find deb-artifacts -name "*.deb" | wc -l)
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "Error: No .deb packages found in deb-artifacts directory!"
            ls -la deb-artifacts || true
            exit 1
          fi

          aptly repo create -distribution=stable -component=main -architectures="amd64,arm64" rusa-repo
          find deb-artifacts -name "*.deb" | xargs -r aptly repo add rusa-repo
          aptly publish repo -batch -architectures="amd64,arm64" rusa-repo

          mkdir -p public
          cp -r ~/.aptly/public/* public/
          if [ -f "public.key" ]; then
            cp public.key public/KEY.gpg
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deb-artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Deploy APT Repository to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-pages:
    needs: publish-repo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
